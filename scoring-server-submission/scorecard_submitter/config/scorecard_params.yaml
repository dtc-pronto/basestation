# ROS2 Parameters for Scorecard Submission Node
# These parameters can be loaded when launching the node

scorecard_submission_node:
  ros__parameters:
    # Whether to start the scoring run immediately when node starts
    start_run: false
    
    # Path to the threshold configuration JSON file
    # This file contains distance thresholds for matching casualties
    threshold_path: "/home/dtc/ws/src/scorecard_submitter/config/threshold_config.json"
    
    # Path to the data directory where casualty databases will be stored
    data_path: "/home/dtc/data"
    
    # List of robots to monitor for casualty reports
    # Valid robot names: dione (UAV), deimos, phobos, titania, oberon (UGVs)
    robots:
      - dione
      - deimos
      - phobos
      - titania
      - oberon
